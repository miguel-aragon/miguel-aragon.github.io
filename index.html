<!DOCTYPE html>
<html>
<head>
    <title>Simplified A-Frame Mixed Reality App for Oculus Quest</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://zest-equal-sneeze.glitch.me/create_axis.js"></script>
</head>
<body>
        <a-assets>
          <a-asset-item id="spheres-obj"  src="Data/2Mpp-groups-LE-120Mpc_COLOR-016.obj"></a-asset-item>
          <a-asset-item id="spheres-mtl"  src="Data/color_map-rainbow-016.mtl"></a-asset-item>
          <a-asset-item id="galaxies-obj" src="Data/2Mpp-galaxies-LE-040Mpc.obj"></a-asset-item>
        </a-assets>
  
    <a-scene webxr="requiredFeatures: hit-test,local-floor; optionalFeatures: dom-overlay; overlayElement: #overlay;">
      
      <a-entity id="container-map" position="0 1.12 -0.5" scale="0.015 0.015 -0.015">
        
        <!-- Map title -->
        <a-text value="The Local Universe" position="0 10 0" color="gray" align="center" width="20" side="double"></a-text>
        
        <!-- Fancy axis -->
        <a-entity id="container-axis" create_axis="axisLength: 5" position="0 0 0"></a-entity>
        
        <!-- Local Sheet 10 Mpc -->
        <a-ring position="0 0 0" rotation="90 0 0" radius-inner="9.9" radius-outer="10" color="gray" side="double"></a-ring>
        
        <!-- Map of groups -->
        <a-entity id="groups">
          <a-entity obj-model="obj: #spheres-obj; mtl: #spheres-mtl"></a-entity>
        </a-entity>

        <!-- Map of groups -->
        <a-entity id="galaxies">
          <a-entity obj-model="obj: #galaxies-obj"></a-entity>
        </a-entity>


      </a-entity>
      
      <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
      <a-entity light="type: directional; intensity: 0.8;" position="-1 1 0"></a-entity> 
       
    </a-scene>
    
    <div id="overlay">
        <button id="ar-button">Start AR</button>
    </div>
    <script>
        const arButton = document.querySelector("#ar-button");
        arButton.addEventListener("click", function () {
            const sceneEl = document.querySelector('a-scene');
            sceneEl.enterAR();
        });
    </script>
</body>
</html>
